<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="page">
    <header class="header">
        <img src="./assets/images/eisenhower-matrix.jpg" 
             alt="Eisenhower Matrix" 
             class="header__image">
        <a class="header__link" 
           href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="container">
        <section>
            <label for="new-task">Add Item</label>
            <div class="task-row-wrapper">
                <input id="new-task" 
                       class="task-input" 
                       type="text">
                <button class="add-button">Add</button>
            </div>
        </section>
        <section>
            <h3>Todo</h3>
            <ul id="incomplete-tasks">
                <li class="task-list__item">
                    <input type="checkbox">
                    <label class="task-list__label">Pay Bills</label>
                    <input type="text" class="task-list__input">
                    <button class="task-list__edit-button">Edit</button>
                    <button class="task-list__delete-button">
                        <img src="./assets/images/remove.svg" 
                             alt="Delete" 
                             class="task-list__delete-icon">
                    </button>
                </li>
                <li class="task-list__item edit-mode">
                    <input type="checkbox">
                    <label class="task-list__label">Go Shopping</label>
                    <input type="text" 
                           value="Go Shopping" 
                           class="task-list__input">
                    <button class="task-list__edit-button">Save</button>
                    <button class="task-list__delete-button">
                        <img src="./assets/images/remove.svg" 
                             alt="Delete" 
                             class="task-list__delete-icon">
                    </button>
                </li>
            </ul>
        </section>
        <section>
            <h3>Completed</h3>
            <ul id="completed-tasks">
                <li class="task-list__item">
                    <input type="checkbox" checked>
                    <label class="task-list__label">See the Doctor</label>
                    <input type="text" class="task-list__input">
                    <button class="task-list__edit-button">Edit</button>
                    <button class="task-list__delete-button">
                        <img src="./assets/images/remove.svg" 
                             alt="Delete" 
                             class="task-list__delete-icon">
                    </button>
                </li>
            </ul>
        </section>
    </main>
    <script src="./app.js"></script>
</body>
</html>
